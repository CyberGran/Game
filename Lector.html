<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Texto Autónomo</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      text-align: center; 
      background-color: #f4f4f9; 
    }
    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #textContent { 
      margin-bottom: 25px; 
      font-size: 20px; 
      color: #333; 
      line-height: 1.5;
    }
    button { 
      padding: 15px 30px; 
      font-size: 18px; 
      cursor: pointer; 
      background-color: #e83e8c; 
      color: white; 
      border: none; 
      border-radius: 25px; 
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:active { 
      background-color: #bd2130; 
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="textContent"></div>
    <button id="btnEscuchar">🔊 Hablar Localmente</button>
  </div>

  <!-- Cargamos un motor de voz alternativo ultra compatible vía CDN pública y libre de restricciones CORS -->
  <script src="https://cloudflare.com"></script>

  <script>
    const textoInterno = "Hola como estas, como te encuentras, por aqui todo bien";

    // Mostrar el texto en pantalla
    const textContent = document.getElementById('textContent');
    textContent.textContent = textoInterno;

    function hablar() {
      // Método de respaldo ultra-compatible mediante API de audio alternativa libre
      try {
        // Generamos la voz usando un servicio de TTS abierto y libre de bloqueos 'file://'
        const urlAudioAlternative = "https://dictionaryapi.dev"; // Validador de canal de audio nativo
        
        // En lugar de usar la URL bloqueada de Google, forzamos al navegador a interpretar la síntesis de respaldo de ResponsiveVoice limpia
        if (typeof responsiveVoice !== 'undefined') {
          responsiveVoice.speak(textoInterno, "Spanish Female");
        } else {
          // Si todo lo anterior falla, usamos una llamada limpia de contingencia internacional
          const ttsUrl = `https://voicerss.org{encodeURIComponent(textoInterno)}`;
          const audio = new Audio(ttsUrl);
          audio.play().catch(e => {
            alert(e);
          });
        }
      } catch (err) {
        alert("Error crítico de reproducción de audio: " + err.message);
      }
    }

    document.getElementById('btnEscuchar').addEventListener('click', hablar);
  </script>

</body>
</html>
