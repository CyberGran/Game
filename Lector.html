<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Texto HD con Números y Ñ</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      text-align: center; 
      background-color: #f4f4f9; 
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #textContent { 
      margin-bottom: 25px; 
      font-size: 26px; 
      color: #111; 
      font-weight: bold;
    }
    button { 
      padding: 18px 40px; 
      font-size: 20px; 
      cursor: pointer; 
      background-color: #10ac84; 
      color: white; 
      border: none; 
      border-radius: 50px; 
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(16, 172, 132, 0.4);
    }
    button:active { 
      background-color: #1dd1a1; 
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Texto de prueba con números y letra Ñ -->
    <div id="textContent"></div>
    <button id="btnEscuchar">🔊 Escuchar Mensaje</button>
  </div>

  <script>
    // Bloque de texto de ejemplo que incluye Ñ y números
    let bloqueTextoActual = "Cual lugar sufrió severos daños durante el terremoto de 1900?  ";

    const textContentDiv = document.getElementById('textContent');
    textContentDiv.textContent = bloqueTextoActual;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let contextoAudio;
    let gananciaMaestra;

    const vocales = {
      'A': { f1: 730, f2: 1150, q1: 15, q2: 15 },
      'E': { f1: 520, f2: 1850, q1: 15, q2: 15 },
      'I': { f1: 300, f2: 2350, q1: 12, q2: 12 },
      'O': { f1: 580, f2: 900,  q1: 16, q2: 16 },
      'U': { f1: 320, f2: 820,  q1: 15, q2: 15 }
    };

    // Función para convertir números de hasta 4 dígitos a palabras en español
    function numeroALetras(num) {
      const unidades = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve'];
      const deces = ['', 'diez', 'veinte', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
      const onceAQuince = ['diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciseis', 'diecisiete', 'dieciocho', 'diecinueve'];
      const veintes = ['veinte', 'veintiuno', 'veintidos', 'veintitres', 'veinticuatro', 'veinticinco', 'veintiseis', 'veintisiete', 'veintiocho', 'veintinueve'];
      const cientos = ['', 'cien', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];

      if (num === 0) return 'cero';
      let letras = '';

      if (num >= 1000) {
        let mil = Math.floor(num / 1000);
        letras += (mil === 1 ? 'mil ' : numeroALetras(mil) + ' mil ');
        num %= 1000;
      }
      if (num >= 100) {
        let cien = Math.floor(num / 100);
        if (cien === 1 && num % 100 > 0) letras += 'ciento ';
        else letras += cientos[cien] + ' ';
        num %= 100;
      }
      if (num >= 20 && num <= 29) {
        letras += veintes[num - 20] + ' ';
        num = 0;
      } else if (num >= 10 && num <= 19) {
        letras += onceAQuince[num - 10] + ' ';
        num = 0;
      } else if (num >= 30) {
        let dec = Math.floor(num / 10);
        letras += deces[dec];
        num %= 10;
        if (num > 0) letras += ' y ';
      }
      if (num > 0) {
        letras += unidades[num];
      }
      return letras.trim();
    }

    // Traductor del bloque de texto completo (convierte "25" -> "veinticinco")
    function preprocesarTexto(texto) {
      return texto.replace(/\d+/g, (match) => numeroALetras(parseInt(match)));
    }

    function crearBufferRuido() {
      const tamañoBuffer = contextoAudio.sampleRate * 0.3;
      const buffer = contextoAudio.createBuffer(1, tamañoBuffer, contextoAudio.sampleRate);
      const datos = buffer.getChannelData(0);
      for (let i = 0; i < tamañoBuffer; i++) {
        datos[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    function hablarVocal(vocal, tiempoInicio, duracion) {
      const config = vocales[vocal] || vocales['A'];
      const osc = contextoAudio.createOscillator();
      const gainNode = contextoAudio.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(125, tiempoInicio); // Tono de voz optimizado para claridad

      const vibrato = contextoAudio.createOscillator();
      const vibratoGain = contextoAudio.createGain();
      vibrato.frequency.setValueAtTime(5.5, tiempoInicio);
      vibratoGain.gain.setValueAtTime(3, tiempoInicio);
      vibrato.connect(vibratoGain);
      vibratoGain.connect(osc.frequency);

      const filtro1 = contextoAudio.createBiquadFilter();
      filtro1.type = 'bandpass';
      filtro1.frequency.setValueAtTime(config.f1, tiempoInicio);
      filtro1.Q.setValueAtTime(config.q1, tiempoInicio);

      const filtro2 = contextoAudio.createBiquadFilter();
      filtro2.type = 'bandpass';
      filtro2.frequency.setValueAtTime(config.f2, tiempoInicio);
      filtro2.Q.setValueAtTime(config.q2, tiempoInicio);

      gainNode.gain.setValueAtTime(0, tiempoInicio);
      gainNode.gain.linearRampToValueAtTime(0.7, tiempoInicio + 0.02);
      gainNode.gain.setValueAtTime(0.7, tiempoInicio + duracion - 0.02);
      gainNode.gain.linearRampToValueAtTime(0, tiempoInicio + duracion);

      osc.connect(filtro1);
      osc.connect(filtro2);
      filtro1.connect(gainNode);
      filtro2.connect(gainNode);
      gainNode.connect(gananciaMaestra);

      vibrato.start(tiempoInicio);
      osc.start(tiempoInicio);
      vibrato.stop(tiempoInicio + duracion);
      osc.stop(tiempoInicio + duracion);
    }

    function hablarConsonante(tipo, tiempoInicio, duracion) {
      const fuenteRuido = contextoAudio.createBufferSource();
      fuenteRuido.buffer = crearBufferRuido();
      const filtroRuido = contextoAudio.createBiquadFilter();
      filtroRuido.type = 'bandpass';
      const gainNode = contextoAudio.createGain();

      if (tipo === 'sibilante') {
        filtroRuido.frequency.setValueAtTime(5000, tiempoInicio);
        filtroRuido.Q.setValueAtTime(1.5, tiempoInicio);
        gainNode.gain.setValueAtTime(0, tiempoInicio);
        gainNode.gain.linearRampToValueAtTime(0.25, tiempoInicio + 0.01);
        gainNode.gain.linearRampToValueAtTime(0, tiempoInicio + duracion);
      } 
      else if (tipo === 'sonora') {
        filtroRuido.frequency.setValueAtTime(1000, tiempoInicio);
        filtroRuido.Q.setValueAtTime(3, tiempoInicio);
        gainNode.gain.setValueAtTime(0, tiempoInicio);
        gainNode.gain.linearRampToValueAtTime(0.35, tiempoInicio + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.01, tiempoInicio + duracion);
      }
      else { // oclusiva
        filtroRuido.frequency.setValueAtTime(2000, tiempoInicio);
        filtroRuido.Q.setValueAtTime(5, tiempoInicio);
        gainNode.gain.setValueAtTime(0, tiempoInicio);
        gainNode.gain.linearRampToValueAtTime(0.5, tiempoInicio + 0.005);
        gainNode.gain.exponentialRampToValueAtTime(0.001, tiempoInicio + duracion);
      }

      fuenteRuido.connect(filtroRuido);
      filtroRuido.connect(gainNode);
      gainNode.connect(gananciaMaestra);
      fuenteRuido.start(tiempoInicio);
      fuenteRuido.stop(tiempoInicio + duracion);
    }

    function procesarYLeerTexto() {
      if (!contextoAudio) {
        contextoAudio = new AudioContext();
        gananciaMaestra = contextoAudio.createGain();
        // REDUCIDO: Bajamos el multiplicador de volumen a 1.3 para nitidez sin saturación
        gananciaMaestra.gain.setValueAtTime(1.3, contextoAudio.currentTime); 
        gananciaMaestra.connect(contextoAudio.destination);
      }

      let tiempoActual = contextoAudio.currentTime;
      const velocidadBase = 0.13;
      
      // Traducir números antes de pasar el texto al motor de audio
      const textoConvertido = preprocesarTexto(bloqueTextoActual);
      const textoLimpio = textoConvertido.toUpperCase();

      for (let i = 0; i < textoLimpio.length; i++) {
        const letra = textoLimpio[i];

        if (letra === ' ') {
          tiempoActual += velocidadBase * 1.6; 
        } 
        else if (['A', 'E', 'I', 'O', 'U'].includes(letra)) {
          hablarVocal(letra, tiempoActual, velocidadBase * 1.1);
          tiempoActual += (velocidadBase * 1.1) + 0.01;
        } 
        else if (letra === 'Ñ') {
          // Fonema compuesto específico para la Ñ (Unión de nasal suave + vocal I ultra veloz)
          hablarConsonante('sonora', tiempoActual, velocidadBase * 0.5);
          tiempoActual += (velocidadBase * 0.4);
          hablarVocal('I', tiempoActual, velocidadBase * 0.4);
          tiempoActual += (velocidadBase * 0.4);
        }
        else if (['S', 'Z', 'F', 'X'].includes(letra)) {
          hablarConsonante('sibilante', tiempoActual, velocidadBase * 0.8);
          tiempoActual += (velocidadBase * 0.8);
        }
        else if (['R', 'L', 'M', 'N', 'Y'].includes(letra)) {
          hablarConsonante('sonora', tiempoActual, velocidadBase * 0.6);
          tiempoActual += (velocidadBase * 0.6);
        }
        else if (['H'].includes(letra)) {
          tiempoActual += velocidadBase * 0.2;
        }
        else {
          hablarConsonante('oclusiva', tiempoActual, velocidadBase * 0.4);
          tiempoActual += (velocidadBase * 0.4);
        }
      }
    }

    function cambiarBloqueTexto(nuevoTexto) {
      bloqueTextoActual = nuevoTexto;
      textContentDiv.textContent = nuevoTexto;
    }

    // Inicializar visualización del texto de prueba
    cambiarBloqueTexto(bloqueTextoActual);

    document.getElementById('btnEscuchar').addEventListener('click', procesarYLeerTexto);
  </script>

</body>
</html>
